apply plugin: 'com.android.application'

/**
 * Contraseñas de firma, fuera del repositorio.
 *
 * Vivían escritas en este archivo, que sí se versiona, así que quedaron
 * publicadas en el historial junto con el propio keystore. Es la clave de
 * subida —la de firma la guarda Google, con Play App Signing activo— pero no
 * hay razón para seguir publicándola en cada commit.
 *
 * No se usa `gradle.properties` porque ese también está en el repositorio.
 * `keystore.properties` está en el .gitignore, y hay una plantilla al lado.
 */
def clavesFirma = new Properties()
def archivoClaves = rootProject.file('keystore.properties')
if (archivoClaves.exists()) {
    archivoClaves.withInputStream { clavesFirma.load(it) }
}

android {
    namespace = "com.worky.app.v2"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.worky.app.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // El 14 (2.1) lo rechazó Google por faltar las credenciales de demo, y
        // un versionCode no se reutiliza aunque la versión nunca se publicara.
        // El 15 se envió el 29/08/2026. El 16 se quemó en un intento fallido:
        // Play lo rechazó por apuntar a API 35 y aun así se quedó con el
        // número. El 17 lleva catálogo en la cotización, «Cotizar» sobre una
        // foto del chat, los datos de pago con QR y ya apunta a API 36.
        //
        // El 18 (2.3): aceptación de las políticas al registrarse y apartado
        // legal en el perfil —lo que Play pide para publicar—, forma de pago y
        // condiciones de negociación en la cotización, cotizar por tallas para
        // confección y calzado, oficios de comercio, y el documento arreglado
        // para imprimir en A4 sin perder el final.
        //
        // El 19 (2.4) es el primero que se ve bien sin cobertura: hasta el 18 la
        // aplicación pedía Tailwind, los iconos y la tipografía a un CDN al
        // arrancar, y en el teléfono salía en crudo. Lleva además los cuatro
        // fallos que destapó la primera prueba con un cliente de verdad —el
        // proyecto no se creaba al aprobar la cotización—, el botón para
        // responder desde el documento, y la cotización de confección: capítulos
        // propios, tallas con su precio y condiciones del sector.
        //
        // El 19 (2.4) se subió, así que su número está gastado.
        //
        // El 20 (2.5) lleva lo que destapó el uso real: recuperar la contraseña
        // —que no existía, y perderla era perder la cuenta—, los gastos del
        // proyecto, que se guardaban y no se volvían a leer, el correo y el
        // celular en la ficha del contacto, el enlace compartido enseñando el
        // mismo documento que se imprime —con sus fotos, que en la cotización
        // básica no salían—, y las iniciales de los contactos dibujadas en el
        // teléfono en vez de pedidas a un tercero con el nombre dentro.
        //
        // Recompilado el 10/09/2026, sin gastar número porque el 20 no llegó a
        // subirse: capítulo de ropa deportiva —prendas, escudos, numeración y
        // nombre de cada jugador—, el producto del catálogo que se mandaba al
        // chat y no se veía, y las dos pantallas de arranque, que llevaban el
        // logo de Capacitor y un emoji de teléfono.
        versionCode 20
        versionName "2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Sin el archivo, Gradle firmaría con nulos y fallaría con un error
            // que no dice de qué va. Mejor decirlo aquí y en cristiano.
            if (!archivoClaves.exists()) {
                throw new GradleException(
                    'Falta android/keystore.properties. Copia keystore.properties.example ' +
                    'y pon las contraseñas del keystore.')
            }
            storeFile project.file('worky-release.jks')
            storePassword clavesFirma['STORE_PASSWORD']
            keyAlias clavesFirma['KEY_ALIAS']
            keyPassword clavesFirma['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            applicationIdSuffix ""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // BLOQUE PARA SOLUCIONAR DUPLICADOS DE KOTLIN
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib now includes these classes")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib now includes these classes")
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
