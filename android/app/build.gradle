apply plugin: 'com.android.application'

/**
 * Contraseñas de firma, fuera del repositorio.
 *
 * Vivían escritas en este archivo, que sí se versiona, así que quedaron
 * publicadas en el historial junto con el propio keystore. Es la clave de
 * subida —la de firma la guarda Google, con Play App Signing activo— pero no
 * hay razón para seguir publicándola en cada commit.
 *
 * No se usa `gradle.properties` porque ese también está en el repositorio.
 * `keystore.properties` está en el .gitignore, y hay una plantilla al lado.
 */
def clavesFirma = new Properties()
def archivoClaves = rootProject.file('keystore.properties')
if (archivoClaves.exists()) {
    archivoClaves.withInputStream { clavesFirma.load(it) }
}

android {
    namespace = "com.worky.app.v2"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.worky.app.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // El 14 (2.1) lo rechazó Google por faltar las credenciales de demo, y
        // un versionCode no se reutiliza aunque la versión nunca se publicara.
        // El 15 se envió el 29/08/2026; el 16 lleva catálogo en la cotización,
        // «Cotizar» sobre una foto del chat y los datos de pago con QR.
        versionCode 16
        versionName "2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Sin el archivo, Gradle firmaría con nulos y fallaría con un error
            // que no dice de qué va. Mejor decirlo aquí y en cristiano.
            if (!archivoClaves.exists()) {
                throw new GradleException(
                    'Falta android/keystore.properties. Copia keystore.properties.example ' +
                    'y pon las contraseñas del keystore.')
            }
            storeFile project.file('worky-release.jks')
            storePassword clavesFirma['STORE_PASSWORD']
            keyAlias clavesFirma['KEY_ALIAS']
            keyPassword clavesFirma['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            applicationIdSuffix ""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // BLOQUE PARA SOLUCIONAR DUPLICADOS DE KOTLIN
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib now includes these classes")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib now includes these classes")
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
