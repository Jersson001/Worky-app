    <title>Worky - Tu Centro de Operaciones Comercial</title>

    <style>
      /* ====== WORKY COLOR PALETTE ====== */
      :root {
        /* Primary - Royal Blue */
        --primary-50: #eff6ff;
        --primary-100: #dbeafe;
        --primary-200: #bfdbfe;
        --primary-300: #93c5fd;
        --primary-400: #60a5fa;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
        --primary-800: #1e40af;
        --primary-900: #1e3a8a;
        
        /* Secondary - Violet */
        --secondary-400: #a78bfa;
        --secondary-500: #8b5cf6;
        --secondary-600: #7c3aed;
        --secondary-700: #6d28d9;
        
        /* Accent - Cyan */
        --accent-400: #22d3ee;
        --accent-500: #06b6d4;
        --accent-600: #0891b2;
        
        /* Success - Emerald */
        --success-400: #34d399;
        --success-500: #10b981;
        --success-600: #059669;
        
        /* Warning - Amber */
        --warning-400: #fbbf24;
        --warning-500: #f59e0b;
        --warning-600: #d97706;
        
        /* Danger - Rose */
        --danger-400: #fb7185;
        --danger-500: #f43f5e;
        --danger-600: #e11d48;
        
        /* Dark Theme Base */
        --dark-950: #020617;
        --dark-900: #0f172a;
        --dark-800: #1e293b;
        --dark-700: #334155;
        --dark-600: #475569;
        --dark-500: #64748b;
        --dark-400: #94a3b8;
        --dark-300: #cbd5e1;
        --dark-200: #e2e8f0;
        --dark-100: #f1f5f9;
        --dark-50: #f8fafc;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, var(--dark-900) 0%, var(--dark-950) 100%);
        color: var(--dark-100);
        min-height: 100vh;
      }
      
      /* Custom Scrollbar - Modern */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--dark-600);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary-500);
      }
      
      /* Modern Glass Background for Chat */
      .chat-bg {
        background: linear-gradient(180deg, var(--dark-800) 0%, var(--dark-900) 100%);
        background-image: 
          radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
      }
      
      /* Glass Effect */
      .glass {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .glass-light {
        background: rgba(248, 250, 252, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      
      /* Gradient Buttons */
      .btn-primary {
        background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
        box-shadow: 0 4px 15px -3px rgba(37, 99, 235, 0.4);
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
        box-shadow: 0 6px 20px -3px rgba(37, 99, 235, 0.5);
      }
      
      .btn-secondary {
        background: linear-gradient(135deg, var(--secondary-600) 0%, var(--secondary-700) 100%);
        box-shadow: 0 4px 15px -3px rgba(124, 58, 237, 0.4);
      }
      
      .btn-accent {
        background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
        box-shadow: 0 4px 15px -3px rgba(6, 182, 212, 0.4);
      }
      
      /* Glow Effects */
      .glow-primary {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      }
      .glow-secondary {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
      }
      .glow-accent {
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      }
      
      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      @keyframes scaleIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in {
        animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideInTop {
        from { transform: translateY(-10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-in-top {
        animation: slideInTop 0.2s ease-out forwards;
      }
      
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
      
      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient {
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Toast animations */
      @keyframes slideInRight {
        from {
          transform: translateX(120%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Printing Rules */
      @media print {
        /* Márgenes propios y no los del navegador, que son de media pulgada
           por lado y dejan el papel demasiado angosto para la hoja. */
        @page {
          size: A4;
          margin: 8mm;
        }
        body * {
          visibility: hidden;
        }
        #printable-area, #printable-area * {
          visibility: visible;
        }
        #printable-area {
          position: absolute;
          left: 0;
          top: 0;
          margin: 0;
          padding: 0;
          box-shadow: none !important;
          /* El documento está maquetado para una hoja de 850px y hay que
             respetarlo. Antes se estiraba a `width:100%`, o sea al ancho del
             papel —unos 730px en A4—, y el interior se reacomodaba a esa
             medida: columnas más angostas, descripciones partidas, todo
             apretado. Ese era el "se encoge" al imprimir.

             Se conserva el ancho real y se reduce la hoja completa con zoom,
             que es lo que mantiene la proporción. 0.86 sale de dividir los
             194mm útiles de un A4 con estos márgenes entre los 850px de la
             hoja; en Carta, que es más ancho, sobra sitio. */
          width: 850px !important;
          max-width: none !important;
          zoom: 0.86;
          /* Y tiene que poder crecer: con el alto fijo y el desbordamiento
             oculto de la pantalla, lo que no cabía en la primera página no
             pasaba a la segunda, se perdía. */
          overflow: visible !important;
          min-height: 0 !important;
          height: auto !important;
          /* Sin esto el navegador descarta los fondos y la cabecera azul del
             documento sale en blanco. */
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        /* El documento se muestra en una capa fija a pantalla completa, y lo
           fijo no pagina: al imprimir vuelve a ser flujo normal. */
        #document-overlay {
          position: static !important;
          display: block !important;
          overflow: visible !important;
          height: auto !important;
          background: #fff !important;
          backdrop-filter: none !important;
        }
        .no-print-controls {
          cursor: default !important;
          user-select: auto !important;
        }
        #financial-report-printable {
          visibility: visible;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: white !important;
          color: black !important;
        }
        #financial-report-printable * {
            visibility: visible;
            color: black !important; 
        }
        /* Specific overrides for chart bars in print */
        #financial-report-printable .bg-emerald-500 { 
          background-color: #10b981 !important; 
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #financial-report-printable .bg-red-400 { 
          background-color: #f87171 !important; 
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        
        .no-print {
          display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {

<script>
  // Manejo de errores global para evitar crashes
  window.addEventListener('error', function(e) {
    console.error('Error capturado:', e.error);
    e.preventDefault();
    return true;
  });
  
  window.addEventListener('unhandledrejection', function(e) {
    console.error('Promise rechazada:', e.reason);
    e.preventDefault();
  });
  
  // Verificar que los recursos se carguen
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM cargado');
    // Esperar un poco antes de cargar el script principal
    setTimeout(function() {
      console.log('Iniciando carga de módulos...');
    }, 100);
  });
</script>
</head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #020617 100%); color: white; font-family: 'Inter', sans-serif;">
        <div style="text-align: center;">
          <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);">
            <span style="font-size: 36px;">📱</span>
          </div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Worky</h1>
          <p style="margin: 10px 0; color: #64748b; font-size: 14px;">Cargando tu espacio de trabajo...</p>
          <div style="width: 120px; height: 3px; background: #1e293b; border-radius: 3px; margin: 20px auto; overflow: hidden;">
            <div style="width: 40%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; animation: loading 1.5s ease-in-out infinite;"></div>
          </div>
          <style>
            @keyframes loading {
              0% { transform: translateX(-100%); }
              50% { transform: translateX(150%); }
              100% { transform: translateX(-100%); }
            }
          </style>
        </div>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
